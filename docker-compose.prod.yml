# Deployment compose file for the RAG. Run the dev one (docker-compose.yml) for
# local work; this one is for a box that strangers can reach.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# `version:` is deliberately absent — it has been ignored since Compose v2 and only
# produces a deprecation warning now.
#
# WHAT THIS FILE CHANGES, AND WHY EACH ONE MATTERS
# -----------------------------------------------
#  1. The REAL (ejentic) backend publishes NO host port. It is reachable only on the
#     internal compose network, by the frontend services via http://backend:8002 —
#     which needs no published port. The public website live-demo is NOT driven by
#     this process: it is served by a SECOND backend, `backend-demo`, booted as
#     RAG_CLIENT=demo over a wholly fictional corpus in its own namespace. That demo
#     backend is the ONLY backend published to the host — 127.0.0.1:8012, loopback
#     only — so the co-located ai-agency site can proxy the public demo through it
#     server-side. It sits behind the `demo` profile, so the prod bring-up command is:
#         docker compose -f docker-compose.prod.yml --profile demo up -d
#     (plain `up -d` is unchanged — backend + public frontend, exactly as before.)
#     ⚠️ The `127.0.0.1:` prefix on backend-demo is load-bearing. A bare `8012:8002`
#     binds 0.0.0.0 and puts the API on the PUBLIC interface — never drop the prefix.
#     Auth still holds regardless (auth.required=true, every caller needs a key) and
#     ufw allows only 22/80/443. Caddy must NEVER proxy 8012 — the one public path in
#     is still the frontend on 3002.
#     WHY the real backend is NOT published: it is single-tenant (main.py:207 fixes the
#     tenant at boot), so a demo key sent to it is a 409 by design — publishing it
#     bought the demo nothing (the demo uses backend-demo) and put the real corpus on
#     the box's loopback for no consumer. That publish (commit 8b05212) is reverted
#     here. If the site ever needs the REAL engine — an authenticated internal tool,
#     not the public demo — publish it THEN, with that justification.
#  2. The frontend publishes to 127.0.0.1 ONLY. Caddy on the same box is the single
#     path in from the internet, terminating TLS. Same shape as the lead-gen
#     approval server (see deploy/Caddyfile.rag).
#  3. No source bind-mounts. The dev file mounts ./backend and ./frontend into the
#     containers, so the running code is whatever is on the host disk. That is the
#     exact trap that already cost this project a day, when a stale checkout served
#     :8002 for 25 hours while the fixed code sat unused on disk.
#  4. RAG_BACKEND_URL, not NEXT_PUBLIC_BACKEND_URL. The proxy prefers the former and
#     only falls back to the latter; more to the point, NEXT_PUBLIC_ is the exact
#     mechanism that inlines a value into the browser bundle. Leaving that variable
#     in a deployment file is an invitation for someone to add the KEY beside it the
#     same way.
#  5. No n8n. The dev file publishes the n8n editor on 5678 with no authentication —
#     fine on a laptop, an unauthenticated admin UI on a public box. The Telegram
#     flow does not need to live here: point n8n (wherever it runs) at the deployed
#     HTTPS hostname with its own key.
#  6. An OPTIONAL internal (staff) deployment, behind a compose profile. `up -d` starts
#     the public UI only, exactly as it did before this existed; `--profile internal
#     up -d` adds a second UI on 127.0.0.1:3003 that authenticates individual people
#     and acts at each person's own tier. Same image, different environment — see the
#     frontend-internal service at the bottom of this file.
#
# SECRETS
# -------
# Nothing secret is in this file or anywhere in the repo. The backend reads them
# from /etc/ejentic-rag/server.env (root-owned, 0600, created on the server — see
# deploy/GO_LIVE.md). The frontend gets exactly ONE key, RAG_UI_KEY, rather than the
# whole file: it authenticates at one clearance and has no business holding the
# executive key. The `:?` form means Compose REFUSES to start if it is unset, which
# matches the backend's own fail-closed boot rather than quietly serving an
# unauthenticated UI.
#
# The internal frontend reads WHO may sign in, their access codes, and the session
# signing secret from a SECOND file, /etc/ejentic-rag/internal.env. Two files because
# they have two different jobs: that container talks only to our own backend, so
# handing it the Pinecone and NVIDIA keys would be giving an internet-adjacent process
# credentials it cannot legitimately use. See deploy/internal.env.example.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        # CPU-ONLY TORCH. This box has no GPU (`torch.cuda.is_available()` is
        # False), but the default wheels drag in the whole CUDA stack — roughly
        # 6 GB of libraries that can never execute here. That is not merely
        # wasteful: 27 GB in use + 10 GB new image + 10 GB build cache = 47 GB on
        # a 45 GB disk, so the disk hit 100% on three separate deploys and twice
        # took out the build. The box also serves client-facing
        # audit.ejentic.xyz, so this was a blast-radius problem, not just slow.
        #
        # Declared HERE rather than passed as --build-arg so it cannot be
        # forgotten on the next build, which would silently reintroduce the
        # 10 GB image and the disk failure with it.
        #
        # ⚠️ VERIFY AFTER CHANGING THIS. If torch resolves broken, the pipeline
        # falls back to the dependency-free BM25 reranker SILENTLY — answers keep
        # coming, slightly worse, and nothing errors. Check the health endpoint
        # reports `"reranker": "SentenceTransformerRerank"` (NOT a BM25 name) and
        # that the logs carry "[rerank] Local sentence-transformers cross-encoder
        # active". See backend/Dockerfile.prod.
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    # NO host port — deliberately. This service holds the REAL corpus and is reachable
    # only on the internal compose network; the frontends use http://backend:8002,
    # which needs no published port. The public live-demo talks to the `backend-demo`
    # service below instead, so the real corpus stays off the host entirely. See note 1
    # at the top of this file for why 8b05212's 127.0.0.1:8002 publish was reverted. Do
    # NOT re-add a host port here for the demo — single-tenant-per-process means a demo
    # key sent here is a 409 (main.py:835), so it would expose the real engine for zero
    # demo benefit.
    # All of the tenant's secrets and tuning. Absolute path: the secret file lives
    # OUTSIDE the git checkout, so a `git clean` or a fresh clone cannot destroy it
    # and a stray `git add -A` cannot commit it.
    env_file:
      # Overridable ONLY so the file can be validated without root
      # (`RAG_SERVER_ENV=./deploy/server.env.example docker compose -f
      # docker-compose.prod.yml config`). On the server, leave it at the default.
      - ${RAG_SERVER_ENV:-/etc/ejentic-rag/server.env}
    environment:
      # Which browser origins may call the backend directly. With the proxy in
      # front, browsers do not call it at all — this stays tight as defence in
      # depth, since the backend sets allow_credentials=True.
      CORS_ORIGINS: ${RAG_CORS_ORIGINS:?set RAG_CORS_ORIGINS to your https origin, e.g. https://rag.example.com}
    volumes:
      # Audit DB, uploads, and the cached cross-encoder weights. A named volume, so
      # `docker compose down` does not take the audit trail with it.
      - rag_data:/app/data
    restart: unless-stopped
    # Sane defaults for a shared box; raise if the reranker gets starved.
    deploy:
      resources:
        limits:
          memory: 4G

  # ── THE PUBLIC LIVE-DEMO BACKEND ─────────────────────────────────────────────
  # A SECOND backend process — identical image and code — booted as RAG_CLIENT=demo.
  # This is what the co-located ai-agency site's /api/rag-demo proxy talks to, and the
  # ONLY backend published to the host (127.0.0.1:8012). It serves clients/demo.json:
  # the demo-sandbox namespace, a wholly fictional company, its own RAG_DEMO_KEY_*.
  #
  # WHY A SEPARATE CONTAINER, NOT THE ejentic BACKEND ABOVE
  # -------------------------------------------------------
  # The backend is single-tenant-per-process: main.py:207 fixes the tenant at boot from
  # RAG_CLIENT, main.py:211 fixes the Pinecone namespace, and a request for any other
  # tenant is a loud 409 (main.py:835). So the demo CANNOT be served by the ejentic
  # process — it needs its own instance pinned to RAG_CLIENT=demo. Isolation is enforced
  # by the process/namespace boundary, not by a trusted branch inside one shared
  # process; that is the same reason the request body's clearance_level may only narrow,
  # never widen. A compromise of this internet-adjacent demo reaches only fictional
  # vectors — no genuine Ejentic or client document is in its namespace or its keys.
  #
  # OPT-IN via the `demo` profile, exactly like frontend-internal. Plain `up -d` does
  # NOT start it; `--profile demo up -d` does. The gate is deliberate: demo.json sets
  # auth.required=true, so this container REFUSES to serve until the three RAG_DEMO_KEY_*
  # are present (the boot gate at main.py:631). Generate them into server.env FIRST
  # (`openssl rand -hex 32` each, never committed), THEN bring the profile up — otherwise
  # it would crash-loop, reloading the cross-encoder on every restart.
  backend-demo:
    profiles: ["demo"]
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        # CPU-only torch, same as the ejentic backend and for the same reasons — see
        # the long note on the backend service above. Keep the two in lockstep.
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    # THE tenant switch, and the only meaningful difference from `backend`. Unset on the
    # ejentic service (so it defaults in); set to demo here so this process loads
    # clients/demo.json and serves the demo-sandbox namespace and nothing else.
    environment:
      RAG_CLIENT: demo
      # Moot in practice — only the server-side proxy calls this, never a browser, so
      # there is no Origin to check — but mirrored for uniformity, and the var is
      # already required by the ejentic backend in the same `up`.
      CORS_ORIGINS: ${RAG_CORS_ORIGINS:?set RAG_CORS_ORIGINS to your https origin}
    # Loopback only. Host 8012 maps to the container's internal 8002 — every backend
    # container listens on 8002 inside itself (Dockerfile CMD), so the host number is
    # just the external label. The 127.0.0.1 prefix keeps it off the public interface;
    # never drop it (a bare 8012:8002 binds 0.0.0.0). Caddy must never proxy it.
    ports:
      - "127.0.0.1:8012:8002"
    # The SAME secret file as the ejentic backend: it holds the shared infra keys
    # (Pinecone, NVIDIA, Gemini) AND the RAG_DEMO_KEY_* this tenant authenticates with.
    # The ejentic process ignores the demo keys (ejentic.json names different env vars),
    # so one file serving both is fine.
    env_file:
      - ${RAG_SERVER_ENV:-/etc/ejentic-rag/server.env}
    volumes:
      # Its OWN named volume, NOT rag_data. The demo's audit trail, uploads and cached
      # weights stay separate from the real tenant's: two processes sharing one SQLite
      # audit DB would contend, and mingling the trails defeats the isolation this split
      # exists for. Cost: the cross-encoder weights download once per volume (a few
      # hundred MB, twice, on first boot) — accepted for the isolation.
      - rag_demo_data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Same ceiling as the ejentic backend — the reranker is the memory hog and
          # this loads the same model. NOTE: with the demo profile up this roughly
          # doubles the stack's memory ceiling (two 4G backends); confirm box headroom.
          memory: 4G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    # Loopback only. Caddy is the only thing that reaches this, over 443.
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      # Service name on the compose network, not localhost — inside a container,
      # localhost is the container itself.
      RAG_BACKEND_URL: http://backend:8002
      # DECISION 2 lives here: the clearance every visitor to this deployment gets.
      # One deployed UI holds one key, so it answers at exactly one tier for
      # everyone who opens it. Guest unless you have deliberately decided otherwise
      # — see deploy/GO_LIVE.md.
      RAG_API_KEY: ${RAG_UI_KEY:?set RAG_UI_KEY to the key this UI should authenticate with (guest unless you decided otherwise)}
    depends_on:
      backend:
        # Wait for the backend to answer, not merely to exist. First boot can take
        # minutes while the cross-encoder downloads, and a frontend that starts
        # early just serves errors to whoever is watching.
        condition: service_healthy
    restart: unless-stopped

  # ── THE INTERNAL (STAFF) DEPLOYMENT ──────────────────────────────────────────
  # This is the answer to DECISION 2's "what if staff need the internal tier".
  #
  # It is OPT-IN via a compose profile, so it does not start unless asked for:
  #
  #     docker compose -f docker-compose.prod.yml up -d                      # public only
  #     docker compose -f docker-compose.prod.yml --profile internal up -d    # both
  #
  # That default matters. `up -d` with no profile brings up exactly what it brought up
  # before this service existed — the public UI holding one guest key. Nothing about
  # the internet-facing surface changes by adding a staff tier beside it.
  #
  # WHY A SECOND CONTAINER RATHER THAN ONE UI THAT SHOWS MORE AFTER LOGIN
  # --------------------------------------------------------------------
  # It IS the same image and the same code — the difference is entirely environment.
  # The hinge is RAG_STAFF: unset, the code runs in single-key mode exactly as the
  # public deployment does; set, it requires a signed session per request and picks the
  # backend key from the signed-in person's tier.
  #
  # Running it as a separate container keeps the two credential sets in separate
  # processes. The public container never holds the employee or executive key at all,
  # so a compromise of the internet-facing surface yields the guest key and nothing
  # more. One container serving both audiences would have to hold every key, which
  # throws that property away for no gain — they share the expensive part (the backend)
  # either way.
  frontend-internal:
    profiles: ["internal"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    # A DIFFERENT loopback port from the public UI, with its own Caddy block on its own
    # hostname. Container-internal it is still 3002; only the host port differs.
    ports:
      - "127.0.0.1:3003:3002"
    # WHO may sign in, their access codes, and the session signing secret. A separate
    # file from server.env on purpose: this container has no business holding the
    # Pinecone or NVIDIA keys, and server.env is full of them.
    env_file:
      # Overridable only so the file can be validated without root — on the server,
      # leave it at the default. See deploy/internal.env.example.
      - ${RAG_INTERNAL_ENV:-/etc/ejentic-rag/internal.env}
    environment:
      RAG_BACKEND_URL: http://backend:8002
      # The role keys, passed through from the shell (the runbook sources server.env
      # before running compose). Deliberately NOT copied into internal.env: a key that
      # lives in two files gets rotated in one of them, and the symptom is a UI that
      # loads fine and 401s on every question.
      #
      # `:-` not `:?` — which tiers this deployment actually staffs is a per-deployment
      # choice, so requiring all three here would be wrong. A person configured for a
      # tier whose key is absent is refused at sign-in and listed in /whoami's
      # `staff_problems`; the fail-closed check lives in the code, where it can see
      # which roles were actually staffed.
      RAG_KEY_GUEST: ${RAG_KEY_GUEST:-}
      RAG_KEY_EMPLOYEE: ${RAG_KEY_EMPLOYEE:-}
      RAG_KEY_EXECUTIVE: ${RAG_KEY_EXECUTIVE:-}
      # NOTE: RAG_API_KEY is deliberately absent. With RAG_STAFF set it would be
      # ignored anyway, and leaving it unset means a mistake in RAG_STAFF cannot
      # silently fall back to serving everyone at one tier with no sign-in.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_data:
  # The demo tenant's own audit DB, uploads and cached cross-encoder weights, kept
  # out of rag_data so the fictional demo and the real tenant never share state.
  rag_demo_data:
